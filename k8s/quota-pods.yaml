apiVersion: v1
kind: Pod
metadata:
  name: quota-one
  namespace: hw5-quota
spec:
  containers:
  - name: hold
    image: hw5-pairs:local
    imagePullPolicy: Never
    command:
    - /bin/sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
