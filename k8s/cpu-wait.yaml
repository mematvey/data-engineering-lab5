apiVersion: v1
kind: Pod
metadata:
  name: cpu-wait
  namespace: hw5
spec:
  containers:
  - name: hold
    image: hw5-pairs:local
    imagePullPolicy: Never
    command:
    - /bin/sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: '12'
        memory: 64Mi
      limits:
        cpu: '12'
        memory: 128Mi
