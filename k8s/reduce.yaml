apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-reduce
  namespace: hw5
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: reduce
        image: hw5-pairs:local
        imagePullPolicy: Never
        args:
        - reduce
        - --count
        - '4'
        env:
        - name: S3_ENDPOINT
          value: http://rustfs-six:9000
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: access
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
